# Checks on every push to main and every pull request: the desktop on Windows, macOS and Linux
# (terminals, paths and shells differ per OS), and the phone app once.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # What must survive closing Hiveory, and how fast it is (ADR 0066), in the built app on each system.
  # A failure here fails the run (ADR 0066 amendment): it has passed on all three systems.
  guards:
    name: Durability, flows, server and speed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      # Ubuntu 24.04 keeps unprivileged programs from the user namespaces Chromium's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Linux runners have no display: Electron draws into a virtual one.
      - name: Durability
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm e2e:durability e2e-out
      # Schedules, queued chat messages, prompts, presets and Sessions, end to end.
      # Each suite after the first runs even when an earlier one failed, so one run reports all of them.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: Flows
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm e2e:flows e2e-out
      # Hiveory as a server, driven like a paired desktop and a phone (no window; headless on Linux).
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: Server
        shell: bash
        run: pnpm e2e:server e2e-out
      # Runners differ too much in speed to compare against a baseline: the numbers are kept with the run.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: Speed
        shell: bash
        env:
          HIVEORY_PERF: report
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm e2e:perf e2e-out
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guards-${{ matrix.os }}
          path: e2e-out
          if-no-files-found: ignore

  phone:
    name: Phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm mobile:check

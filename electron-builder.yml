# Installers for every platform, all branded from resources/icon.png
# (electron-builder derives .ico / .icns from the 512×512 PNG).
appId: com.hiveory.app
productName: Hiveory
copyright: Copyright © 2026 Raktim Yoddha
icon: resources/icon.png
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  # Native PTY binaries (and the bundled conpty.dll) must live outside the asar.
  - node_modules/@lydell/**
  # Queen Bee's speech engine (native addon + onnxruntime libraries).
  - node_modules/sherpa-onnx-*/**
  # Queen Bee's opt-in system-wide shortcut (native keyboard hook).
  - node_modules/uiohook-napi/**
  # Window icon is read from disk at runtime.
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  shortcutName: Hiveory
mac:
  # The build machine's architecture: native modules (PTY, speech) install for the host only.
  # The zip is what the in-app updater downloads on macOS; the dmg is for first installs.
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Hiveory listens only while you hold Queen Bee's talk shortcut, and transcribes on this computer.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Raktim Yoddha
  artifactName: ${productName}-${version}.${ext}
publish:
  # Installers + latest.yml go to GitHub Releases; electron-updater reads them back.
  provider: github
  owner: raktim-yoddha
  repo: hiveory
  # Published releases (not drafts) so the in-app updater sees them immediately.
  releaseType: release

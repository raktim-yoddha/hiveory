[workspace]
members = [
  "hiveory-desktop/src-tauri",
  "hiveory-crates/hiveory-protocol",
  "hiveory-crates/hiveory-domain-common",
  "hiveory-crates/hiveory-security",
  "hiveory-crates/hiveory-persistence",
  "hiveory-crates/hiveory-secret-store",
  "hiveory-crates/hiveory-model-gateway",
  "hiveory-crates/hiveory-job-runtime",
  "hiveory-crates/hiveory-tool-runtime",
  "hiveory-crates/hiveory-notification-service",
  "hiveory-crates/hiveory-artifact-store",
  "hiveory-crates/hiveory-chat-domain",
  "hiveory-crates/hiveory-code-domain",
  "hiveory-crates/hiveory-code-runtime",
  "hiveory-crates/hiveory-code-orchestration",
  "hiveory-crates/hiveory-agent-domain",
  "hiveory-crates/hiveory-agent-runtime",
  "hiveory-crates/hiveory-plugin-runtime",
  "hiveory-crates/hiveory-routine-scheduler",
  "hiveory-crates/hiveory-dispatch-bridge",
  "hiveory-crates/hiveory-git-service",
  "hiveory-crates/hiveory-workspace-service",
  "hiveory-tooling",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hiveory/hiveory"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
base64 = "0.22"
cap-std = "4"
futures-util = "0.3"
git2 = "0.21"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hmac = "0.12"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
portable-pty = "0.9"
zip = "2"

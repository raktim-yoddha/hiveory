[workspace]
members = [
  "agentic-super-app-desktop/src-tauri",
  "agentic-super-app-crates/agentic-super-app-protocol",
  "agentic-super-app-crates/agentic-super-app-domain-common",
  "agentic-super-app-crates/agentic-super-app-security",
  "agentic-super-app-crates/agentic-super-app-persistence",
  "agentic-super-app-crates/agentic-super-app-secret-store",
  "agentic-super-app-crates/agentic-super-app-model-gateway",
  "agentic-super-app-crates/agentic-super-app-job-runtime",
  "agentic-super-app-crates/agentic-super-app-tool-runtime",
  "agentic-super-app-crates/agentic-super-app-notification-service",
  "agentic-super-app-crates/agentic-super-app-artifact-store",
  "agentic-super-app-crates/agentic-super-app-chat-domain",
  "agentic-super-app-tooling",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/agentic-super-app/agentic-super-app"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
zip = "2"

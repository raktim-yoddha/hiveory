[workspace]
members = [
  "agentic-super-app-desktop/src-tauri",
  "agentic-super-app-crates/agentic-super-app-protocol",
  "agentic-super-app-crates/agentic-super-app-domain-common",
  "agentic-super-app-crates/agentic-super-app-security",
  "agentic-super-app-crates/agentic-super-app-persistence",
  "agentic-super-app-crates/agentic-super-app-secret-store",
  "agentic-super-app-crates/agentic-super-app-model-gateway",
  "agentic-super-app-crates/agentic-super-app-job-runtime",
  "agentic-super-app-crates/agentic-super-app-tool-runtime",
  "agentic-super-app-crates/agentic-super-app-notification-service",
  "agentic-super-app-crates/agentic-super-app-artifact-store",
  "agentic-super-app-crates/agentic-super-app-chat-domain",
  "agentic-super-app-crates/agentic-super-app-code-domain",
  "agentic-super-app-crates/agentic-super-app-code-runtime",
  "agentic-super-app-crates/agentic-super-app-code-orchestration",
  "agentic-super-app-crates/agentic-super-app-agent-domain",
  "agentic-super-app-crates/agentic-super-app-agent-runtime",
  "agentic-super-app-crates/agentic-super-app-plugin-runtime",
  "agentic-super-app-crates/agentic-super-app-routine-scheduler",
  "agentic-super-app-crates/agentic-super-app-dispatch-bridge",
  "agentic-super-app-crates/agentic-super-app-git-service",
  "agentic-super-app-crates/agentic-super-app-workspace-service",
  "agentic-super-app-tooling",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/agentic-super-app/agentic-super-app"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
base64 = "0.22"
cap-std = "4"
futures-util = "0.3"
git2 = "0.21"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hmac = "0.12"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
portable-pty = "0.9"
zip = "2"

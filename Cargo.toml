[workspace]
members = [
  "src/apps/desktop/src-tauri",
  "src/crates/core/hiveory-protocol",
  "src/crates/core/hiveory-domain-common",
  "src/crates/core/hiveory-platform-process",
  "src/crates/core/hiveory-security",
  "src/crates/core/hiveory-persistence",
  "src/crates/core/hiveory-secret-store",
  "src/crates/core/hiveory-model-gateway",
  "src/crates/core/hiveory-job-runtime",
  "src/crates/core/hiveory-tool-runtime",
  "src/crates/core/hiveory-notification-service",
  "src/crates/core/hiveory-artifact-store",
  "src/crates/modes/chat/hiveory-chat-domain",
  "src/crates/modes/code/hiveory-code-domain",
  "src/crates/modes/code/hiveory-code-runtime",
  "src/crates/modes/code/hiveory-terminal-host",
  "src/crates/modes/code/hiveory-code-orchestration",
  "src/crates/modes/agent/hiveory-agent-domain",
  "src/crates/modes/agent/hiveory-agent-runtime",
  "src/crates/global/plugins/hiveory-plugin-runtime",
  "src/crates/global/automations/hiveory-routine-scheduler",
  "src/crates/modes/code/hiveory-dispatch-bridge",
  "src/crates/modes/code/hiveory-git-service",
  "src/crates/modes/code/hiveory-workspace-service",
  "tools",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hiveory/hiveory"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
arboard = { version = "3.6.1", default-features = false }
cap-std = "4"
futures-util = "0.3"
git2 = "0.21"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hmac = "0.12"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
portable-pty = "0.9"
zip = "2"

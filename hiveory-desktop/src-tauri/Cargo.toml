[package]
name = "hiveory-app-host"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hiveory-protocol = { path = "../../hiveory-crates/hiveory-protocol" }
hiveory-artifact-store = { path = "../../hiveory-crates/hiveory-artifact-store" }
hiveory-agent-runtime = { path = "../../hiveory-crates/hiveory-agent-runtime" }
hiveory-plugin-runtime = { path = "../../hiveory-crates/hiveory-plugin-runtime" }
hiveory-chat-domain = { path = "../../hiveory-crates/hiveory-chat-domain" }
hiveory-code-domain = { path = "../../hiveory-crates/hiveory-code-domain" }
hiveory-code-orchestration = { path = "../../hiveory-crates/hiveory-code-orchestration" }
hiveory-code-runtime = { path = "../../hiveory-crates/hiveory-code-runtime" }
hiveory-git-service = { path = "../../hiveory-crates/hiveory-git-service" }
hiveory-job-runtime = { path = "../../hiveory-crates/hiveory-job-runtime" }
hiveory-model-gateway = { path = "../../hiveory-crates/hiveory-model-gateway" }
hiveory-notification-service = { path = "../../hiveory-crates/hiveory-notification-service" }
hiveory-persistence = { path = "../../hiveory-crates/hiveory-persistence" }
hiveory-secret-store = { path = "../../hiveory-crates/hiveory-secret-store" }
hiveory-tool-runtime = { path = "../../hiveory-crates/hiveory-tool-runtime" }
hiveory-routine-scheduler = { path = "../../hiveory-crates/hiveory-routine-scheduler" }
hiveory-workspace-service = { path = "../../hiveory-crates/hiveory-workspace-service" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
aes-gcm.workspace = true
arboard.workspace = true
tauri = { version = "2", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
url.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "hiveory_app_host"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hiveory-desktop"
path = "src/main.rs"
